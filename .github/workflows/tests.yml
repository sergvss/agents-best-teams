name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    name: Защитные хуки и связность документации
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Нижняя граница — заявленная в hooks/README, верхняя — актуальная.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Прогон тестов
        run: python -X utf8 -m unittest discover -s hooks/tests -v

  manifests:
    name: Манифесты плагина
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка JSON
        run: |
          for file in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                      hooks/hooks.json hooks/settings.example.json; do
            python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$file"
            echo "OK $file"
          done

      - name: Бейдж версии читает манифест
        # Бейдж в README берёт версию прямо из plugin.json, чтобы её не
        # приходилось помнить в третьем месте. Проверяем, что источник на месте
        # и что путь в бейдже указывает именно туда.
        run: |
          python - <<'PY'
          import json, re, sys, urllib.parse
          readme = open("README.md", encoding="utf-8").read()
          match = re.search(r"img\.shields\.io/badge/dynamic/json\?url=([^&\"]+)", readme)
          if not match:
              print("::warning::в README нет динамического бейджа версии")
              sys.exit(0)
          target = urllib.parse.unquote(match.group(1))
          if not target.endswith("/.claude-plugin/plugin.json"):
              print("::warning::бейдж версии читает не манифест плагина: " + target)
              sys.exit(0)
          json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))["version"]
          print("бейдж версии указывает на манифест, поле version на месте")
          PY

      - name: Свежесть таблицы моделей
        # Предупреждение, а не провал: устаревшая таблица моделей — повод
        # пересмотреть конфиг, а не запрещать людям собирать форк.
        run: |
          python - <<'PY'
          import datetime, re, sys
          text = open("agents.config.example", encoding="utf-8").read()
          match = re.search(r"models_reviewed:\s*(\d{4}-\d{2}-\d{2})", text)
          if not match:
              print("::warning::в agents.config.example нет отметки models_reviewed")
              sys.exit(0)
          reviewed = datetime.date.fromisoformat(match.group(1))
          days = (datetime.date.today() - reviewed).days
          if days > 92:
              print("::warning::таблица моделей не сверялась {} дней "
                    "(последняя сверка {}). Порог правила не устаревает, "
                    "а слаги и цены — да.".format(days, reviewed))
          else:
              print("таблица моделей сверялась {} дней назад — свежо".format(days))
          PY

      - name: Версия в VERSION и plugin.json совпадают
        run: |
          version_file=$(tr -d '[:space:]' < VERSION)
          version_manifest=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json', encoding='utf-8'))['version'])")
          if [ "$version_file" != "$version_manifest" ]; then
            echo "VERSION=$version_file, plugin.json=$version_manifest — расходятся"
            exit 1
          fi
          echo "OK $version_file"
